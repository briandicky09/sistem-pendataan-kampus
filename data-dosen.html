<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Dosen | Sistem Pendataan Kampus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/topbar-extra.css">
</head>
<body>
  <div class="app-wrapper" data-page="data-dosen"></div>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/topbar.js" defer></script>
  <div id="page-content" hidden>
    <div class="page-head">
      <h1>Data Dosen</h1>
      <nav><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active">Data Dosen</li></ol></nav>
    </div>
    <div class="card-box p-0">
      <div class="card-box-head px-3 py-2 d-flex align-items-center border-bottom">
        <span>Daftar Dosen</span>
        <div class="ms-auto d-flex gap-2">
          <input type="text" id="searchDsn" class="form-control form-control-sm" placeholder="Cari nama / NIDN / prodi...">
          <button class="btn btn-sm btn-outline-secondary" id="exportDsn"><i class="fa-solid fa-file-export"></i></button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tabelDsn">
          <thead class="table-light">
            <tr>
              <th style="width:50px">#</th>
              <th>Nama</th>
              <th style="width:150px">NIDN</th>
              <th>Program Studi</th>
              <th style="width:130px">Jabatan</th>
              <th style="width:100px">Status</th>
              <th style="width:100px" class="text-end">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top">
        <small class="text-muted" id="pgInfoDsn"></small>
        <nav><ul class="pagination pagination-sm mb-0" id="pgDsn"></ul></nav>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('shell:ready', ()=>{
      const DOSEN = [
        {nama:'Dr. Hadi Santoso, M.Kom.',     nidn:'0012078001', prodi:'Teknik Informatika',     jabatan:'Lektor Kepala', status:'aktif'},
        {nama:'Dr. Siti Nurhaliza, M.Kom.',   nidn:'0023118502', prodi:'Sistem Informasi',       jabatan:'Lektor',        status:'aktif'},
        {nama:'Ir. Bambang Wijaya, M.T.',     nidn:'0005056001', prodi:'Teknik Komputer',        jabatan:'Lektor Kepala', status:'aktif'},
        {nama:'Anisa Permata, S.Kom., M.Cs.', nidn:'0019059003', prodi:'Sistem Informasi',       jabatan:'Asisten Ahli',  status:'aktif'},
        {nama:'Drs. Joko Pramono, M.Si.',     nidn:'0028025502', prodi:'Manajemen Informatika',  jabatan:'Lektor',        status:'cuti'},
        {nama:'Rina Kartika, M.Kom.',         nidn:'0030089201', prodi:'Teknik Informatika',     jabatan:'Asisten Ahli',  status:'aktif'},
        {nama:'Fauzi Rahman, Ph.D.',          nidn:'0014017701', prodi:'Teknik Informatika',     jabatan:'Guru Besar',    status:'aktif'},
        {nama:'Yulia Kusuma, M.T.',           nidn:'0007088804', prodi:'Teknik Komputer',        jabatan:'Lektor',        status:'aktif'},
        {nama:'Dwi Hartono, M.Kom.',          nidn:'0011096502', prodi:'Manajemen Informatika',  jabatan:'Lektor',        status:'aktif'},
        {nama:'Sari Indrawati, M.Cs.',        nidn:'0021129501', prodi:'Sistem Informasi',       jabatan:'Asisten Ahli',  status:'aktif'},
      ];
      const pillFor = s => s==='aktif'?'bg-success':s==='cuti'?'bg-warning':'bg-secondary';
      const perPage = 5; let page = 1; let filtered = [...DOSEN];

      function render(){
        const tbody = document.querySelector('#tabelDsn tbody');
        const start = (page-1)*perPage;
        const rows = filtered.slice(start, start+perPage);
        tbody.innerHTML = rows.map((d,i)=>`
          <tr>
            <td>${start+i+1}.</td>
            <td><strong>${d.nama}</strong></td>
            <td><code>${d.nidn}</code></td>
            <td>${d.prodi}</td>
            <td>${d.jabatan}</td>
            <td><span class="pill ${pillFor(d.status)}">${d.status}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary" title="Edit"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger"  title="Hapus"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`).join('') || `<tr><td colspan="7" class="text-center text-muted py-4">Data tidak ditemukan.</td></tr>`;

        const totalPages = Math.max(1, Math.ceil(filtered.length/perPage));
        document.getElementById('pgInfoDsn').textContent =
          `Menampilkan ${filtered.length?start+1:0} - ${Math.min(start+perPage,filtered.length)} dari ${filtered.length} data`;
        let pg = `<li class="page-item ${page===1?'disabled':''}"><a class="page-link" href="#" data-p="${page-1}">«</a></li>`;
        for(let i=1;i<=totalPages;i++) pg += `<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" data-p="${i}">${i}</a></li>`;
        pg += `<li class="page-item ${page===totalPages?'disabled':''}"><a class="page-link" href="#" data-p="${page+1}">»</a></li>`;
        document.getElementById('pgDsn').innerHTML = pg;
      }
      document.addEventListener('click', e=>{
        const a = e.target.closest('#pgDsn a');
        if(a){ e.preventDefault(); const p=+a.dataset.p; const t=Math.ceil(filtered.length/perPage);
          if(p>=1 && p<=t){ page=p; render(); } }
      });
      document.getElementById('searchDsn').addEventListener('input', e=>{
        const q = e.target.value.toLowerCase();
        filtered = DOSEN.filter(d => (d.nama+d.nidn+d.prodi+d.jabatan).toLowerCase().includes(q));
        page = 1; render();
      });
      document.getElementById('exportDsn').addEventListener('click', ()=>{
        const csv = ['Nama,NIDN,Prodi,Jabatan,Status', ...DOSEN.map(d=>[d.nama,d.nidn,d.prodi,d.jabatan,d.status].join(','))].join('\n');
        const a = document.createElement('a');
        a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
        a.download = 'data-dosen.csv'; a.click();
        spToast('Data dosen diekspor (CSV)','success');
      });
      render();
    });
  </script>
</body>
</html>
